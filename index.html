<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CashNest</title>
    <meta name="description" content="CashNest - Personal Budget Tracker PWA">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="config.js"></script>
    <style>
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .checkbox-item.checked {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
            opacity: 1;
        }
        .nav-item.active {
            color: #4f46e5;
        }
        .nav-item.active svg {
            stroke: #4f46e5;
        }
        body {
            padding-bottom: 80px;
        }
        
        /* Dark Mode Styles */
        .dark body {
            background-color: #1a1a2e;
            color: #e2e8f0;
        }
        .dark .bg-white {
            background-color: #252542;
            color: #e2e8f0;
        }
        .dark .bg-gray-100 {
            background-color: #1a1a2e;
        }
        .dark .bg-gray-50 {
            background-color: #252542;
        }
        .dark .text-gray-800 {
            color: #e2e8f0;
        }
        .dark .text-gray-700 {
            color: #cbd5e1;
        }
        .dark .text-gray-600 {
            color: #94a3b8;
        }
        .dark .text-gray-500 {
            color: #64748b;
        }
        .dark .border-gray-300 {
            border-color: #3f3f5f;
        }
        .dark .border-gray-200 {
            border-color: #2d2d4a;
        }
        .dark .bg-purple-50 {
            background-color: #2d2d4a;
        }
        .dark .bg-purple-100 {
            background-color: #3f3f5f;
        }
        .dark .border-purple-200 {
            border-color: #5b5b7a;
        }
        .dark .bg-blue-50 {
            background-color: #2d2d4a;
        }
        .dark .bg-blue-100 {
            background-color: #3f3f5f;
        }
        .dark .border-blue-200 {
            border-color: #5b5b7a;
        }
        .dark .bg-red-50 {
            background-color: #2d2d4a;
        }
        .dark .bg-red-100 {
            background-color: #3f3f5f;
        }
        .dark .border-red-200 {
            border-color: #5b5b7a;
        }
        .dark input, .dark select, .dark textarea {
            background-color: #252542;
            color: #e2e8f0;
            border-color: #3f3f5f;
        }
        .dark input:focus, .dark select:focus {
            border-color: #6366f1;
            outline: none;
        }
        .dark .bg-gradient-to-r {
            background-image: linear-gradient(to right, #4f46e5cc, #7c3aedcc);
        }
        .dark .bg-indigo-50 {
            background-color: #2d2d4a;
        }
        .dark nav {
            background-color: #252542;
            border-color: #3f3f5f;
        }
        .dark .nav-item {
            color: #94a3b8;
        }
        .dark .nav-item:hover {
            color: #a5b4fc;
        }
        .dark .nav-item.active {
            color: #818cf8;
        }
        .dark .nav-item.active svg {
            stroke: #818cf8;
        }
        .dark .text-red-500 {
            color: #f87171;
        }
        .dark .text-red-500:hover {
            color: #fca5a5;
        }
        .dark .text-indigo-500 {
            color: #818cf8;
        }
        .dark .text-indigo-500:hover {
            color: #a5b4fc;
        }
        .dark .text-green-500 {
            color: #4ade80;
        }
        .dark .text-green-600 {
            color: #22c55e;
        }
        .dark .text-red-600 {
            color: #ef4444;
        }
        .dark .bg-green-50 {
            background-color: #2d2d4a;
        }
        .dark .border-green-200 {
            border-color: #5b5b7a;
        }
        .dark .bg-red-50 {
            background-color: #2d2d4a;
        }
        .dark .border-red-200 {
            border-color: #5b5b7a;
        }
        
        /* Prevent auto-zoom on mobile */
        input, select, textarea {
            font-size: 16px !important;
        }
        
        /* Custom Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background-color: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .dark .modal-content {
            background-color: #252542;
            color: #e2e8f0;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1f2937;
        }
        .dark .modal-title {
            color: #e2e8f0;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .dark .modal-input {
            background-color: #1a1a2e;
            border-color: #3f3f5f;
            color: #e2e8f0;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .modal-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .modal-btn-cancel {
            background-color: #e5e7eb;
            color: #374151;
        }
        .dark .modal-btn-cancel {
            background-color: #3f3f5f;
            color: #e2e8f0;
        }
        .modal-btn-cancel:hover {
            background-color: #d1d5db;
        }
        .dark .modal-btn-cancel:hover {
            background-color: #4f4f6f;
        }
        .modal-btn-confirm {
            background-color: #6366f1;
            color: white;
        }
        .modal-btn-confirm:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Sticky Header with Balance -->
    <header class="sticky-header bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex-1">
                <h1 class="text-2xl font-bold">CashNest</h1>
                <div class="text-center">
                    <p class="text-sm opacity-90">Current Balance</p>
                    <p id="currentBalance" class="text-4xl font-bold">₱0.00</p>
                </div>
            </div>
            <div class="flex items-center gap-2 ml-4">
                <button onclick="exportPDF()" class="p-2 rounded-full hover:bg-white/20 transition" title="Download PDF Report">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </button>
                <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-white/20 transition" id="themeToggle">
                    <span id="themeIcon" class="text-2xl">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6">
        <!-- Tab 1: Add Credit -->
        <div id="tab-credit" class="tab-content active">
            <section class="bg-white rounded-xl shadow-md p-5">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="text-green-500 mr-2">➕</span> Add Credit
                </h2>
                <!-- Filter Dropdowns -->
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Month</label>
                        <select id="creditFilterMonth" onchange="updateUI()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Months</option>
                            <option value="0">January</option>
                            <option value="1">February</option>
                            <option value="2">March</option>
                            <option value="3">April</option>
                            <option value="4">May</option>
                            <option value="5">June</option>
                            <option value="6">July</option>
                            <option value="7">August</option>
                            <option value="8">September</option>
                            <option value="9">October</option>
                            <option value="10">November</option>
                            <option value="11">December</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Year</label>
                        <select id="creditFilterYear" onchange="updateUI()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Years</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-4">
                    <input type="number" id="creditAmount" placeholder="Amount" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    <input type="text" id="creditSource" placeholder="Source (e.g., Salary, Allowance)" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    <button onclick="addCredit()" 
                        class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-3 px-4 rounded-lg transition-all hover:shadow-md">
                        Add Credit
                    </button>
                </div>
            </section>
        </div>

        <!-- Tab 2: Planned Allocations -->
        <div id="tab-allocations" class="tab-content">
            <section class="bg-white rounded-xl shadow-md p-5">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="text-blue-500 mr-2">📋</span> Planned Allocations
                </h2>
                <!-- Filter Dropdowns -->
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Month</label>
                        <select id="allocationFilterMonth" onchange="updateUI()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Months</option>
                            <option value="0">January</option>
                            <option value="1">February</option>
                            <option value="2">March</option>
                            <option value="3">April</option>
                            <option value="4">May</option>
                            <option value="5">June</option>
                            <option value="6">July</option>
                            <option value="7">August</option>
                            <option value="8">September</option>
                            <option value="9">October</option>
                            <option value="10">November</option>
                            <option value="11">December</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Year</label>
                        <select id="allocationFilterYear" onchange="updateUI()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Years</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-4">
                    <input type="text" id="allocationName" placeholder="Expense Name (e.g., Tuition)" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    <input type="number" id="allocationAmount" placeholder="Amount" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    <button onclick="addAllocation()" 
                        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg transition-all hover:shadow-md">
                        Add Planned Expense
                    </button>
                </div>
                <div id="allocationsList" class="space-y-2 mt-4"></div>
            </section>
        </div>

        <!-- Tab 3: Instant Spending -->
        <div id="tab-instant" class="tab-content">
            <section class="bg-white rounded-xl shadow-md p-5">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="text-red-500 mr-2">⚡</span> Instant Spending Log
                </h2>
                <!-- Filter Dropdowns -->
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Month</label>
                        <select id="instantFilterMonth" onchange="updateUI()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Months</option>
                            <option value="0">January</option>
                            <option value="1">February</option>
                            <option value="2">March</option>
                            <option value="3">April</option>
                            <option value="4">May</option>
                            <option value="5">June</option>
                            <option value="6">July</option>
                            <option value="7">August</option>
                            <option value="8">September</option>
                            <option value="9">October</option>
                            <option value="10">November</option>
                            <option value="11">December</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Year</label>
                        <select id="instantFilterYear" onchange="updateUI()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Years</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-4">
                    <input type="text" id="instantDescription" placeholder="Description (e.g., Food, Transport)" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    <input type="number" id="instantAmount" placeholder="Amount" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    <button onclick="addInstantLog()" 
                        class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-4 rounded-lg transition-all hover:shadow-md">
                        Log Instant Spending
                    </button>
                </div>
                <div id="instantLogList" class="space-y-2 mt-4"></div>
            </section>
        </div>

        <!-- Tab 4: Market Checklist -->
        <div id="tab-market" class="tab-content">
            <section class="bg-white rounded-xl shadow-md p-5">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="text-purple-500 mr-2">🛒</span> Checklist
                </h2>
                <!-- Filter Dropdowns -->
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Month</label>
                        <select id="marketFilterMonth" onchange="updateUI()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Months</option>
                            <option value="0">January</option>
                            <option value="1">February</option>
                            <option value="2">March</option>
                            <option value="3">April</option>
                            <option value="4">May</option>
                            <option value="5">June</option>
                            <option value="6">July</option>
                            <option value="7">August</option>
                            <option value="8">September</option>
                            <option value="9">October</option>
                            <option value="10">November</option>
                            <option value="11">December</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Year</label>
                        <select id="marketFilterYear" onchange="updateUI()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Years</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-4">
                    <input type="text" id="marketItem" placeholder="Shopping Item" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                    <button onclick="addMarketItem()" 
                        class="w-full bg-purple-500 hover:bg-purple-600 text-white font-semibold py-3 px-4 rounded-lg transition-all hover:shadow-md">
                        Add to Checklist
                    </button>
                </div>
                <div id="marketChecklist" class="space-y-2 mt-4"></div>
            </section>
        </div>

        <!-- Tab 5: Transaction History -->
        <div id="tab-history" class="tab-content">
            <section class="bg-white rounded-xl shadow-md p-5">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <span class="text-gray-500 mr-2">📜</span> Transaction History
                </h2>
                
                <!-- Filter Dropdowns -->
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Month</label>
                        <select id="filterMonth" onchange="updateTransactionHistory()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                            <option value="all">All Months</option>
                            <option value="0">January</option>
                            <option value="1">February</option>
                            <option value="2">March</option>
                            <option value="3">April</option>
                            <option value="4">May</option>
                            <option value="5">June</option>
                            <option value="6">July</option>
                            <option value="7">August</option>
                            <option value="8">September</option>
                            <option value="9">October</option>
                            <option value="10">November</option>
                            <option value="11">December</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Year</label>
                        <select id="filterYear" onchange="updateTransactionHistory()" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                        </select>
                    </div>
                </div>

                <!-- Summary Card -->
                <div id="summaryCard" class="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-lg p-4 mb-4 border border-indigo-200">
                    <h3 class="text-sm font-semibold text-gray-700 mb-2">Summary for Selected Period</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-xs text-gray-600">Total Credits</p>
                            <p id="totalCredits" class="text-lg font-bold text-green-600">₱0.00</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-600">Total Expenses</p>
                            <p id="totalExpenses" class="text-lg font-bold text-red-600">₱0.00</p>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-3">
                    <button onclick="clearHistory()" 
                        class="text-sm text-red-500 hover:text-red-700 underline">
                        Clear History
                    </button>
                </div>
                <div id="transactionHistory" class="space-y-2 max-h-96 overflow-y-auto"></div>
            </section>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around items-center py-2">
            <button onclick="switchTab('credit')" class="nav-item active flex flex-col items-center p-2 text-gray-600 hover:text-indigo-600 transition" data-tab="credit">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
                <span class="text-xs mt-1">Credit</span>
            </button>
            <button onclick="switchTab('allocations')" class="nav-item flex flex-col items-center p-2 text-gray-600 hover:text-indigo-600 transition" data-tab="allocations">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <span class="text-xs mt-1">Planned</span>
            </button>
            <button onclick="switchTab('instant')" class="nav-item flex flex-col items-center p-2 text-gray-600 hover:text-indigo-600 transition" data-tab="instant">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <span class="text-xs mt-1">Instant</span>
            </button>
            <button onclick="switchTab('market')" class="nav-item flex flex-col items-center p-2 text-gray-600 hover:text-indigo-600 transition" data-tab="market">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="text-xs mt-1">CheckList</span>
            </button>
            <button onclick="switchTab('history')" class="nav-item flex flex-col items-center p-2 text-gray-600 hover:text-indigo-600 transition" data-tab="history">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-xs mt-1">History</span>
            </button>
        </div>
    </nav>

    <!-- Custom Modal for Price Input -->
    <div id="priceModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Enter Price</h3>
            <input type="number" id="modalPriceInput" class="modal-input" placeholder="Enter price" step="0.01">
            <div class="modal-buttons">
                <button onclick="closePriceModal()" class="modal-btn modal-btn-cancel">Cancel</button>
                <button onclick="confirmPriceModal()" class="modal-btn modal-btn-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Load saved theme on page load
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeIcon = document.getElementById('themeIcon');
            
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                themeIcon.textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.textContent = '🌙';
            }
        }

        // Data Structure
        let budgetData = {
            credits: [],
            allocations: [],
            instantLogs: [],
            marketChecklist: [],
            transactionHistory: []
        };

        // Calculate current balance by processing all transactions chronologically
        function calculateCurrentBalance() {
            let balance = 0;
            const sortedTransactions = [...budgetData.transactionHistory].sort((a, b) => a.date - b.date);
            
            sortedTransactions.forEach(transaction => {
                balance += transaction.amount;
            });
            
            return balance;
        }

        // Get carry-over balance from previous month
        function getCarryOverBalance(selectedMonth, selectedYear) {
            let balance = 0;
            const sortedTransactions = [...budgetData.transactionHistory].sort((a, b) => a.date - b.date);
            
            sortedTransactions.forEach(transaction => {
                const transactionDate = new Date(transaction.date);
                const transactionMonth = transactionDate.getMonth();
                const transactionYear = transactionDate.getFullYear();
                
                // Only include transactions from before the selected month
                const isBeforeSelectedMonth = 
                    transactionYear < selectedYear || 
                    (transactionYear === selectedYear && transactionMonth < selectedMonth);
                
                if (isBeforeSelectedMonth) {
                    balance += transaction.amount;
                }
            });
            
            return balance;
        }

        // Recalculate all resultingBalance values in transactionHistory chronologically
        function recalculateAllBalances() {
            let balance = 0;
            const sortedTransactions = [...budgetData.transactionHistory].sort((a, b) => a.date - b.date);
            
            sortedTransactions.forEach(transaction => {
                balance += transaction.amount;
                transaction.resultingBalance = balance;
            });
        }

        // Initialize Year Dropdown
        function initializeYearDropdown() {
            const yearSelect = document.getElementById('filterYear');
            const monthSelect = document.getElementById('filterMonth');
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth();
            
            // Add "All Years" option
            const allYearsOption = document.createElement('option');
            allYearsOption.value = 'all';
            allYearsOption.textContent = 'All Years';
            yearSelect.appendChild(allYearsOption);
            
            // Add current year and next 5 years
            for (let i = 0; i <= 5; i++) {
                const year = currentYear + i;
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (i === 0) option.selected = true; // Select current year by default
                yearSelect.appendChild(option);
            }

            // Set current month by default
            if (monthSelect) {
                monthSelect.value = currentMonth;
            }

            // Initialize year dropdowns for other tabs
            const creditYearSelect = document.getElementById('creditFilterYear');
            const creditMonthSelect = document.getElementById('creditFilterMonth');
            const allocationYearSelect = document.getElementById('allocationFilterYear');
            const allocationMonthSelect = document.getElementById('allocationFilterMonth');
            const instantYearSelect = document.getElementById('instantFilterYear');
            const instantMonthSelect = document.getElementById('instantFilterMonth');
            const marketYearSelect = document.getElementById('marketFilterYear');
            const marketMonthSelect = document.getElementById('marketFilterMonth');

            [creditYearSelect, allocationYearSelect, instantYearSelect, marketYearSelect].forEach(select => {
                if (select) {
                    select.innerHTML = '<option value="all">All Years</option>';
                    for (let i = 0; i <= 5; i++) {
                        const year = currentYear + i;
                        const option = document.createElement('option');
                        option.value = year;
                        option.textContent = year;
                        if (i === 0) option.selected = true; // Select current year by default
                        select.appendChild(option);
                    }
                }
            });

            // Set current month for all tabs
            [creditMonthSelect, allocationMonthSelect, instantMonthSelect, marketMonthSelect].forEach(select => {
                if (select) {
                    select.value = currentMonth;
                }
            });
        }

        // Firebase Configuration (loaded from config.js)
        // If firebaseConfig is not defined, skip Firebase initialization
        if (typeof firebaseConfig === 'undefined') {
            console.warn('Firebase configuration not found. Running in local mode without Firebase sync.');
            // Set up mock Firebase objects to prevent errors
            const db = {
                collection: () => ({
                    doc: () => ({
                        get: async () => ({ exists: false }),
                        set: async () => {}
                    })
                })
            };
            const auth = {
                signInAnonymously: async () => ({ user: { uid: 'local' } }),
                onAuthStateChanged: (callback) => callback({ uid: 'local' })
            };
        } else {
            // Initialize Firebase
            firebase.initializeApp(firebaseConfig);
            var db = firebase.firestore();
            var auth = firebase.auth();
        }

        // Anonymous Authentication
        let isAuthenticated = false;

        async function signInAnonymously() {
            try {
                const result = await auth.signInAnonymously();
                isAuthenticated = true;
                console.log('Signed in anonymously:', result.user.uid);
                return result.user;
            } catch (error) {
                console.error('Anonymous sign-in error:', error);
                throw error;
            }
        }

        // Listen for authentication state changes
        auth.onAuthStateChanged((user) => {
            if (user) {
                isAuthenticated = true;
                console.log('User is signed in:', user.uid);
                // Load data after successful authentication
                loadData();
            } else {
                isAuthenticated = false;
                console.log('User is signed out');
                // Try to sign in anonymously
                signInAnonymously().catch(err => {
                    console.error('Failed to sign in anonymously:', err);
                });
            }
        });

        // IndexedDB Setup
        const DB_NAME = 'CashNestDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'budgetData';
        const SYNC_QUEUE_STORE = 'syncQueue';

        let dbInstance = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    dbInstance = request.result;
                    resolve(dbInstance);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains(SYNC_QUEUE_STORE)) {
                        const syncStore = db.createObjectStore(SYNC_QUEUE_STORE, { keyPath: 'id', autoIncrement: true });
                        syncStore.createIndex('timestamp', 'timestamp', { unique: false });
                    }
                };
            });
        }

        // IndexedDB Operations
        async function saveToIndexedDB(data) {
            if (!dbInstance) await openDB();
            return new Promise((resolve, reject) => {
                const transaction = dbInstance.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put({ id: 'budgetData', ...data });
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function loadFromIndexedDB() {
            if (!dbInstance) await openDB();
            return new Promise((resolve, reject) => {
                const transaction = dbInstance.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get('budgetData');
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Sync Queue Operations
        async function addToSyncQueue(operation) {
            if (!dbInstance) await openDB();
            return new Promise((resolve, reject) => {
                const transaction = dbInstance.transaction([SYNC_QUEUE_STORE], 'readwrite');
                const store = transaction.objectStore(SYNC_QUEUE_STORE);
                const request = store.add({
                    operation,
                    timestamp: Date.now(),
                    synced: false
                });
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function getSyncQueue() {
            if (!dbInstance) await openDB();
            return new Promise((resolve, reject) => {
                const transaction = dbInstance.transaction([SYNC_QUEUE_STORE], 'readonly');
                const store = transaction.objectStore(SYNC_QUEUE_STORE);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function removeFromSyncQueue(id) {
            if (!dbInstance) await openDB();
            return new Promise((resolve, reject) => {
                const transaction = dbInstance.transaction([SYNC_QUEUE_STORE], 'readwrite');
                const store = transaction.objectStore(SYNC_QUEUE_STORE);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // Network Status
        let isOnline = navigator.onLine;

        window.addEventListener('online', () => {
            isOnline = true;
            syncQueueToFirebase();
        });

        window.addEventListener('offline', () => {
            isOnline = false;
        });

        // Firebase Operations
        async function saveToFirebase(data) {
            try {
                if (!isAuthenticated) {
                    console.log('Not authenticated, skipping Firebase save');
                    return false;
                }
                await db.collection('budgetData').doc('userBudget').set(data);
                return true;
            } catch (error) {
                console.error('Firebase save error:', error);
                return false;
            }
        }

        async function loadFromFirebase() {
            try {
                if (!isAuthenticated) {
                    console.log('Not authenticated, skipping Firebase load');
                    return null;
                }
                const doc = await db.collection('budgetData').doc('userBudget').get();
                if (doc.exists) {
                    return doc.data();
                }
                return null;
            } catch (error) {
                console.error('Firebase load error:', error);
                return null;
            }
        }

        // Sync Queue to Firebase
        async function syncQueueToFirebase() {
            if (!isOnline || !isAuthenticated) return;

            const queue = await getSyncQueue();
            if (queue.length === 0) {
                updateSyncStatus('synced');
                return;
            }

            // Sort by timestamp to ensure chronological order
            queue.sort((a, b) => a.timestamp - b.timestamp);

            for (const item of queue) {
                try {
                    const { operation } = item;
                    // Apply operation to Firebase
                    await applyOperationToFirebase(operation);
                    await removeFromSyncQueue(item.id);
                } catch (error) {
                    console.error('Sync error for item:', item, error);
                }
            }

            updateSyncStatus('synced');
        }

        async function applyOperationToFirebase(operation) {
            const currentData = await loadFromFirebase() || budgetData;
            
            switch (operation.type) {
                case 'addCredit':
                    currentData.credits.push(operation.data);
                    break;
                case 'addAllocation':
                    currentData.allocations.push(operation.data);
                    break;
                case 'toggleAllocation':
                    const allocIndex = currentData.allocations.findIndex(a => a.id === operation.data.id);
                    if (allocIndex !== -1) {
                        currentData.allocations[allocIndex].checked = operation.data.checked;
                    }
                    break;
                case 'deleteAllocation':
                    currentData.allocations = currentData.allocations.filter(a => a.id !== operation.data.id);
                    break;
                case 'addInstantLog':
                    currentData.instantLogs.push(operation.data);
                    break;
                case 'deleteInstantLog':
                    currentData.instantLogs = currentData.instantLogs.filter(l => l.id !== operation.data.id);
                    break;
                case 'addMarketItem':
                    currentData.marketChecklist.push(operation.data);
                    break;
                case 'updateMarketItemPrice':
                    const marketIndex = currentData.marketChecklist.findIndex(i => i.id === operation.data.id);
                    if (marketIndex !== -1) {
                        currentData.marketChecklist[marketIndex].price = operation.data.price;
                    }
                    break;
                case 'toggleMarketItem':
                    const marketItemIndex = currentData.marketChecklist.findIndex(i => i.id === operation.data.id);
                    if (marketItemIndex !== -1) {
                        currentData.marketChecklist[marketItemIndex].checked = operation.data.checked;
                    }
                    break;
                case 'deleteMarketItem':
                    currentData.marketChecklist = currentData.marketChecklist.filter(i => i.id !== operation.data.id);
                    break;
                case 'clearHistory':
                    currentData.transactionHistory = [];
                    break;
            }

            await saveToFirebase(currentData);
        }

        // Load data from IndexedDB and Firebase
        async function loadData() {
            // Try to load from IndexedDB first (offline)
            const localData = await loadFromIndexedDB();
            if (localData) {
                budgetData = localData;
                updateUI();
            }

            // Wait for authentication before syncing with Firebase
            if (!isAuthenticated) {
                console.log('Waiting for authentication...');
                updateSyncStatus('syncing');
                return;
            }

            // If online and authenticated, sync with Firebase
            if (isOnline && isAuthenticated) {
                const firebaseData = await loadFromFirebase();
                if (firebaseData) {
                    // Conflict resolution: Last Write Wins (Firebase wins if timestamp is newer)
                    if (!localData || firebaseData.lastModified > localData.lastModified) {
                        budgetData = firebaseData;
                        await saveToIndexedDB(budgetData);
                        updateUI();
                    }
                }
                updateSyncStatus('synced');
            } else {
                updateSyncStatus('offline');
            }
        }

        // Save data to IndexedDB and Firebase
        async function saveData(operation = null) {
            budgetData.lastModified = Date.now();
            
            // Save to IndexedDB (local)
            await saveToIndexedDB(budgetData);
            
            // If online, save to Firebase directly
            if (isOnline) {
                const success = await saveToFirebase(budgetData);
                if (success) {
                    updateSyncStatus('synced');
                } else {
                    // If Firebase fails, add to sync queue
                    if (operation) {
                        await addToSyncQueue(operation);
                    }
                    updateSyncStatus('offline');
                }
            } else {
                // If offline, add to sync queue
                if (operation) {
                    await addToSyncQueue(operation);
                }
                updateSyncStatus('offline');
            }
        }

        // Format currency
        function formatCurrency(amount) {
            return '₱' + parseFloat(amount).toFixed(2);
        }

        // Format date
        function formatDate(timestamp) {
            return new Date(timestamp).toLocaleString('en-PH', {
                dateStyle: 'short',
                timeStyle: 'short'
            });
        }

        // Get transaction date - always use current date/time
        function getTransactionDate(prefix) {
            // Always use current date/time when adding transactions
            // The Month/Year dropdowns are only for filtering/viewing, not for setting transaction dates
            return Date.now();
        }

        // Get filtered transactions based on selected month/year
        function getFilteredTransactions() {
            const selectedMonth = document.getElementById('filterMonth').value;
            const selectedYear = document.getElementById('filterYear').value;
            
            return budgetData.transactionHistory.filter(transaction => {
                const transactionDate = new Date(transaction.date);
                const transactionMonth = transactionDate.getMonth();
                const transactionYear = transactionDate.getFullYear();
                
                const monthMatch = selectedMonth === 'all' || transactionMonth === parseInt(selectedMonth);
                const yearMatch = selectedYear === 'all' || transactionYear === parseInt(selectedYear);
                
                return monthMatch && yearMatch;
            });
        }

        // Update transaction history with filtering
        function updateTransactionHistory() {
            renderTransactionHistory();
        }

        // Switch Tab
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // Update navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.tab === tabName) {
                    item.classList.add('active');
                }
            });

            // No need to set default date since we use Month/Year dropdowns
        }

        // Update all UI elements
        function updateUI() {
            document.getElementById('currentBalance').textContent = formatCurrency(calculateCurrentBalance());
            renderAllocations();
            renderInstantLogs();
            renderMarketChecklist();
            renderTransactionHistory();
        }

        // Add Credit
        function addCredit() {
            const amount = parseFloat(document.getElementById('creditAmount').value);
            const source = document.getElementById('creditSource').value.trim();

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            if (!source) {
                alert('Please enter a source');
                return;
            }

            const timestamp = getTransactionDate('credit');
            budgetData.credits.push({
                id: timestamp,
                amount: amount,
                source: source,
                timestamp: timestamp
            });

            budgetData.transactionHistory.push({
                date: timestamp,
                description: `Credit: ${source}`,
                amount: amount,
                resultingBalance: 0,
                type: 'credit'
            });

            recalculateAllBalances();
            saveData({ type: 'addCredit', data: { id: timestamp, amount, source, timestamp } });
            updateUI();

            document.getElementById('creditAmount').value = '';
            document.getElementById('creditSource').value = '';
        }

        // Add Planned Allocation
        function addAllocation() {
            const name = document.getElementById('allocationName').value.trim();
            const amount = parseFloat(document.getElementById('allocationAmount').value);

            if (!name) {
                alert('Please enter an expense name');
                return;
            }

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            const timestamp = getTransactionDate('allocation');
            const uniqueId = Date.now(); // Use Date.now() for truly unique ID
            budgetData.allocations.push({
                id: uniqueId,
                name: name,
                amount: amount,
                checked: false,
                timestamp: timestamp
            });

            saveData({ type: 'addAllocation', data: { id: uniqueId, name, amount, checked: false, timestamp } });
            updateUI();

            document.getElementById('allocationName').value = '';
            document.getElementById('allocationAmount').value = '';
        }

        // Toggle Allocation Checkbox
        function toggleAllocation(id) {
            const allocation = budgetData.allocations.find(a => a.id === id);
            if (!allocation) return;

            if (!allocation.checked) {
                // Checking the box - subtract from balance using allocation's assigned date
                budgetData.transactionHistory.push({
                    date: allocation.timestamp, // Use allocation's assigned date, not current date
                    description: `Expense: ${allocation.name}`,
                    amount: -allocation.amount,
                    resultingBalance: 0,
                    type: 'allocation',
                    allocationId: allocation.id // Store allocation ID for reliable matching
                });
            } else {
                // Unchecking - add back to balance using allocation's assigned date
                budgetData.transactionHistory.push({
                    date: allocation.timestamp, // Use allocation's assigned date, not current date
                    description: `Undo: ${allocation.name}`,
                    amount: allocation.amount,
                    resultingBalance: 0,
                    type: 'allocation_undo',
                    allocationId: allocation.id // Store allocation ID for reliable matching
                });
            }

            allocation.checked = !allocation.checked;
            recalculateAllBalances();
            saveData({ type: 'toggleAllocation', data: { id: allocation.id, checked: allocation.checked } });
            updateUI();
        }

        // Delete Allocation
        function deleteAllocation(id) {
            const allocation = budgetData.allocations.find(a => a.id === id);
            if (!allocation) return;

            if (allocation.checked) {
                // Find and remove the corresponding transaction from history using allocation ID
                budgetData.transactionHistory = budgetData.transactionHistory.filter(t => 
                    t.allocationId !== id
                );
            }

            budgetData.allocations = budgetData.allocations.filter(a => a.id !== id);
            recalculateAllBalances();
            saveData({ type: 'deleteAllocation', data: { id } });
            updateUI();
        }

        // Render Allocations
        function renderAllocations() {
            const container = document.getElementById('allocationsList');
            container.innerHTML = '';

            const selectedMonth = document.getElementById('allocationFilterMonth').value;
            const selectedYear = document.getElementById('allocationFilterYear').value;

            // Filter allocations by selected Month/Year
            const filteredAllocations = budgetData.allocations.filter(allocation => {
                if (selectedMonth === 'all' && selectedYear === 'all') return true;
                
                const allocationDate = new Date(allocation.timestamp);
                const allocationMonth = allocationDate.getMonth();
                const allocationYear = allocationDate.getFullYear();
                
                const monthMatch = selectedMonth === 'all' || allocationMonth === parseInt(selectedMonth);
                const yearMatch = selectedYear === 'all' || allocationYear === parseInt(selectedYear);
                
                return monthMatch && yearMatch;
            });

            if (filteredAllocations.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm text-center">No items for selected period</p>';
                return;
            }

            filteredAllocations.forEach(allocation => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-lg border ${allocation.checked ? 'bg-gray-100 border-gray-300' : 'bg-blue-50 border-blue-200'}`;
                div.innerHTML = `
                    <div class="flex items-center flex-1">
                        <input type="checkbox" ${allocation.checked ? 'checked' : ''} 
                            onchange="toggleAllocation(${allocation.id})"
                            class="w-5 h-5 mr-3 accent-blue-500">
                        <div class="${allocation.checked ? 'checkbox-item checked' : ''}">
                            <p class="font-medium text-gray-800">${allocation.name}</p>
                            <p class="text-sm text-gray-600">${formatCurrency(allocation.amount)}</p>
                        </div>
                    </div>
                    <button onclick="deleteAllocation(${allocation.id})" class="text-red-500 hover:text-red-700 ml-2">🗑️</button>
                `;
                container.appendChild(div);
            });
        }

        // Add Instant Log
        function addInstantLog() {
            const description = document.getElementById('instantDescription').value.trim();
            const amount = parseFloat(document.getElementById('instantAmount').value);

            if (!description) {
                alert('Please enter a description');
                return;
            }

            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            const timestamp = getTransactionDate('instant');

            budgetData.instantLogs.push({
                id: timestamp,
                description: description,
                amount: amount,
                timestamp: timestamp
            });

            budgetData.transactionHistory.push({
                date: timestamp,
                description: description,
                amount: -amount,
                resultingBalance: 0,
                type: 'instant'
            });

            recalculateAllBalances();
            saveData({ type: 'addInstantLog', data: { id: timestamp, description, amount, timestamp } });
            updateUI();

            document.getElementById('instantDescription').value = '';
            document.getElementById('instantAmount').value = '';
        }

        // Delete Instant Log
        function deleteInstantLog(id) {
            const log = budgetData.instantLogs.find(l => l.id === id);
            if (!log) return;

            // Find and remove the corresponding transaction from history
            budgetData.transactionHistory = budgetData.transactionHistory.filter(t => 
                t.description !== log.description || t.type !== 'instant'
            );

            budgetData.instantLogs = budgetData.instantLogs.filter(l => l.id !== id);
            recalculateAllBalances();
            saveData({ type: 'deleteInstantLog', data: { id } });
            updateUI();
        }

        // Render Instant Logs
        function renderInstantLogs() {
            const container = document.getElementById('instantLogList');
            container.innerHTML = '';

            const selectedMonth = document.getElementById('instantFilterMonth').value;
            const selectedYear = document.getElementById('instantFilterYear').value;

            // Filter instant logs by selected Month/Year
            const filteredLogs = budgetData.instantLogs.filter(log => {
                if (selectedMonth === 'all' && selectedYear === 'all') return true;
                
                const logDate = new Date(log.timestamp);
                const logMonth = logDate.getMonth();
                const logYear = logDate.getFullYear();
                
                const monthMatch = selectedMonth === 'all' || logMonth === parseInt(selectedMonth);
                const yearMatch = selectedYear === 'all' || logYear === parseInt(selectedYear);
                
                return monthMatch && yearMatch;
            });

            if (filteredLogs.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm text-center">No items for selected period</p>';
                return;
            }

            filteredLogs.forEach(log => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 rounded-lg bg-red-50 border border-red-200';
                div.innerHTML = `
                    <div class="flex-1">
                        <p class="font-medium text-gray-800">${log.description}</p>
                        <p class="text-sm text-gray-600">${formatCurrency(log.amount)}</p>
                        <p class="text-xs text-gray-400">${formatDate(log.timestamp)}</p>
                    </div>
                    <button onclick="deleteInstantLog(${log.id})" 
                        class="text-red-500 hover:text-red-700 ml-2">
                        🗑️
                    </button>
                `;
                container.appendChild(div);
            });
        }

        // Add Market Item
        function addMarketItem() {
            const item = document.getElementById('marketItem').value.trim();

            if (!item) {
                alert('Please enter an item');
                return;
            }

            const timestamp = getTransactionDate('market');
            const uniqueId = Date.now(); // Use unique timestamp for ID
            budgetData.marketChecklist.push({
                id: uniqueId,
                item: item,
                price: 0, // Default to 0 - price added later via Edit
                checked: false,
                timestamp: timestamp
            });

            saveData({ type: 'addMarketItem', data: { id: uniqueId, item, price: 0, checked: false, timestamp } });
            updateUI();

            document.getElementById('marketItem').value = '';
        }

        // Custom Modal Functions
        let currentEditingItemId = null;

        function openPriceModal(itemName, currentPrice, itemId) {
            document.getElementById('modalTitle').textContent = `Enter price for "${itemName}"`;
            document.getElementById('modalPriceInput').value = currentPrice || '';
            currentEditingItemId = itemId;
            document.getElementById('priceModal').classList.add('active');
            document.getElementById('modalPriceInput').focus();
        }

        function closePriceModal() {
            document.getElementById('priceModal').classList.remove('active');
            currentEditingItemId = null;
        }

        function confirmPriceModal() {
            if (currentEditingItemId === null) return;
            
            const newPrice = document.getElementById('modalPriceInput').value;
            const price = parseFloat(newPrice) || 0;
            
            const item = budgetData.marketChecklist.find(i => i.id === currentEditingItemId);
            if (!item) return;

            const oldPrice = item.price || 0;
            item.price = price;

            // If item is already checked and price changed, update transaction
            if (item.checked) {
                if (oldPrice === 0 && price > 0) {
                    // Price was 0, now has value - add transaction
                    budgetData.transactionHistory.push({
                        date: Date.now(),
                        description: `Market: ${item.item}`,
                        amount: -price,
                        resultingBalance: 0,
                        type: 'market'
                    });
                    recalculateAllBalances();
                } else if (oldPrice > 0 && price > 0 && oldPrice !== price) {
                    // Price changed - remove old transaction and add new one
                    budgetData.transactionHistory = budgetData.transactionHistory.filter(t => 
                        t.description !== `Market: ${item.item}` && t.description !== `Unmarked: ${item.item}`
                    );
                    budgetData.transactionHistory.push({
                        date: Date.now(),
                        description: `Market: ${item.item}`,
                        amount: -price,
                        resultingBalance: 0,
                        type: 'market'
                    });
                    recalculateAllBalances();
                }
            }

            saveData({ type: 'updateMarketItemPrice', data: { id: currentEditingItemId, price } });
            updateUI();
            closePriceModal();
        }

        // Edit Market Item Price
        function editMarketItemPrice(id) {
            const item = budgetData.marketChecklist.find(i => i.id === id);
            if (!item) return;

            openPriceModal(item.item, item.price, id);
        }

        // Toggle Market Item - CRITICAL: Subtract price when checked
        function toggleMarketItem(id) {
            const item = budgetData.marketChecklist.find(i => i.id === id);
            if (!item) return;

            if (!item.checked) {
                // Checking the box
                item.checked = true;

                if (item.price > 0) {
                    // Has price - subtract from balance and add to history
                    budgetData.transactionHistory.push({
                        date: Date.now(),
                        description: `Market: ${item.item}`,
                        amount: -item.price,
                        resultingBalance: 0,
                        type: 'market'
                    });
                }
                // No price - just toggle visual state
            } else {
                // Unchecking - add back to balance if had price
                item.checked = false;

                if (item.price > 0) {
                    budgetData.transactionHistory.push({
                        date: Date.now(),
                        description: `Unmarked: ${item.item}`,
                        amount: item.price,
                        resultingBalance: 0,
                        type: 'market_undo'
                    });
                }
            }

            recalculateAllBalances();
            saveData({ type: 'toggleMarketItem', data: { id, checked: item.checked } });
            updateUI();
        }

        // Delete Market Item
        function deleteMarketItem(id) {
            const itemIndex = budgetData.marketChecklist.findIndex(i => i.id === id);
            if (itemIndex === -1) return;

            const item = budgetData.marketChecklist[itemIndex];

            if (item.checked && item.price > 0) {
                // Find and remove the corresponding transaction from history
                budgetData.transactionHistory = budgetData.transactionHistory.filter(t => 
                    t.description !== `Market: ${item.item}` && t.description !== `Unmarked: ${item.item}`
                );
            }

            // Remove the specific item by index to ensure only one item is deleted
            budgetData.marketChecklist.splice(itemIndex, 1);
            recalculateAllBalances();
            saveData({ type: 'deleteMarketItem', data: { id } });
            updateUI();
        }

        // Render Market Checklist
        function renderMarketChecklist() {
            const container = document.getElementById('marketChecklist');
            container.innerHTML = '';

            const selectedMonth = document.getElementById('marketFilterMonth').value;
            const selectedYear = document.getElementById('marketFilterYear').value;

            // Filter market checklist by selected Month/Year
            const filteredItems = budgetData.marketChecklist.filter(item => {
                if (selectedMonth === 'all' && selectedYear === 'all') return true;
                
                const itemDate = new Date(item.timestamp);
                const itemMonth = itemDate.getMonth();
                const itemYear = itemDate.getFullYear();
                
                const monthMatch = selectedMonth === 'all' || itemMonth === parseInt(selectedMonth);
                const yearMatch = selectedYear === 'all' || itemYear === parseInt(selectedYear);
                
                return monthMatch && yearMatch;
            });

            if (filteredItems.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm text-center">No items for selected period</p>';
                return;
            }

            filteredItems.forEach(item => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-lg border ${item.checked ? 'bg-gray-100 border-gray-300' : 'bg-purple-50 border-purple-200'}`;
                div.innerHTML = `
                    <div class="flex items-center flex-1">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} 
                            onchange="toggleMarketItem(${item.id})"
                            class="w-5 h-5 mr-3 accent-purple-500">
                        <div class="${item.checked ? 'checkbox-item checked' : ''}">
                            <p class="font-medium text-gray-800">${item.item}</p>
                            ${item.price > 0 ? `<p class="text-sm text-gray-600">${formatCurrency(item.price)}</p>` : '<p class="text-sm text-gray-400">No price set</p>'}
                        </div>
                    </div>
                    <div class="flex items-center ml-2">
                        <button onclick="editMarketItemPrice(${item.id})" class="text-blue-500 hover:text-blue-700 mr-2">✏️</button>
                        <button onclick="deleteMarketItem(${item.id})" class="text-red-500 hover:text-red-700">🗑️</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Render Transaction History
        function renderTransactionHistory() {
            const container = document.getElementById('transactionHistory');
            container.innerHTML = '';
            
            const selectedMonth = document.getElementById('filterMonth').value;
            const selectedYear = document.getElementById('filterYear').value;
            
            const filteredTransactions = getFilteredTransactions();
            
            // Sort transactions by date (newest first)
            filteredTransactions.sort((a, b) => b.date - a.date);
            
            // Calculate carry-over balance if filtering by specific month
            let carryOverBalance = 0;
            if (selectedMonth !== 'all' && selectedYear !== 'all') {
                carryOverBalance = getCarryOverBalance(parseInt(selectedMonth), parseInt(selectedYear));
            }
            
            // Update summary card (only show filtered period's specific math, not including carry-over)
            let totalCredits = 0;
            let totalExpenses = 0;
            
            filteredTransactions.forEach(transaction => {
                if (transaction.amount > 0) {
                    totalCredits += transaction.amount;
                } else {
                    totalExpenses += Math.abs(transaction.amount);
                }
            });
            
            document.getElementById('totalCredits').textContent = formatCurrency(totalCredits);
            document.getElementById('totalExpenses').textContent = formatCurrency(totalExpenses);

            // Display carry-over balance if filtering by specific month
            if (selectedMonth !== 'all' && selectedYear !== 'all' && carryOverBalance !== 0) {
                const carryOverDiv = document.createElement('div');
                carryOverDiv.className = 'p-3 rounded-lg border bg-indigo-50 border-indigo-200 mb-2';
                carryOverDiv.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <p class="font-medium text-indigo-800">Carry Over from Previous Month</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-indigo-600">
                                ${formatCurrency(carryOverBalance)}
                            </p>
                        </div>
                    </div>
                `;
                container.appendChild(carryOverDiv);
            }

            if (filteredTransactions.length === 0) {
                if (carryOverBalance === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-sm text-center">No transactions found for this period</p>';
                }
                return;
            }

            filteredTransactions.forEach(transaction => {
                const div = document.createElement('div');
                const isPositive = transaction.amount > 0;
                div.className = `p-3 rounded-lg border ${isPositive ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <p class="font-medium text-gray-800">${transaction.description}</p>
                            <p class="text-xs text-gray-500">${formatDate(transaction.date)}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold ${isPositive ? 'text-green-600' : 'text-red-600'}">
                                ${isPositive ? '+' : ''}${formatCurrency(transaction.amount)}
                            </p>
                            <p class="text-xs text-gray-500">Balance: ${formatCurrency(transaction.resultingBalance)}</p>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Clear History
        function clearHistory() {
            if (confirm('Are you sure you want to clear all transaction history? This cannot be undone.')) {
                budgetData.transactionHistory = [];
                saveData({ type: 'clearHistory', data: {} });
                updateUI();
            }
        }

        // Export PDF
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Get filtered transactions
            const filteredTransactions = getFilteredTransactions();
            
            // Format amount for PDF with +/- based on transaction type
            function formatPDFAmount(transaction) {
                const amount = Math.abs(transaction.amount).toFixed(2);
                if (transaction.type === 'credit' || transaction.type === 'allocation_undo' || transaction.type === 'market_undo') {
                    return `+${amount}`;
                } else {
                    return `-${amount}`;
                }
            }
            
            // Format balance for PDF (no +/-)
            function formatPDFBalance(amount) {
                return `₱${Math.abs(amount).toFixed(2)}`;
            }
            
            // Title
            doc.setFontSize(20);
            doc.text('CashNest Financial Report', 14, 22);
            
            // Current Balance - only show if there are transactions
            if (filteredTransactions.length > 0) {
                doc.setFontSize(14);
                doc.text(`Current Balance: ${formatPDFBalance(budgetData.currentBalance)}`, 14, 35);
            }
            
            // Transaction History Table
            if (filteredTransactions.length > 0) {
                const tableData = filteredTransactions.map(t => [
                    formatDate(t.date),
                    t.description,
                    formatPDFAmount(t),
                    formatPDFBalance(t.resultingBalance)
                ]);
                
                doc.autoTable({
                    startY: 45,
                    head: [['Date', 'Description', 'Amount', 'Balance']],
                    body: tableData,
                    theme: 'grid',
                    headStyles: { fillColor: [79, 70, 229] },
                    styles: { fontSize: 10 },
                    didDrawCell: function(data) {
                        // Color the Amount column (index 2)
                        if (data.section === 'body' && data.column.index === 2) {
                            const cellText = data.cell.raw;
                            if (cellText.startsWith('+')) {
                                data.cell.styles.textColor = [0, 128, 0]; // Green
                            } else if (cellText.startsWith('-')) {
                                data.cell.styles.textColor = [220, 0, 0]; // Red
                            }
                        }
                    }
                });
            } else {
                doc.setFontSize(12);
                doc.text('No transactions to display for selected period', 14, 50);
            }
            
            // Save PDF
            doc.save('budget-tracker-report.pdf');
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed', err));
        }

        // Initialize
        (async function init() {
            await openDB();
            loadTheme();
            initializeYearDropdown();
            // loadData will be called after authentication
        })();
    </script>
</body>
</html>
